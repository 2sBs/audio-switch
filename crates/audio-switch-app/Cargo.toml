[package]
name = "audio-switch"
version.workspace = true
description = "Windows tray app and Stream Deck controller for Audio Switch"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
anyhow.workspace = true
audio-switch-core = { path = "../audio-switch-core" }
serde_json.workspace = true
tungstenite.workspace = true
windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "audio-switch"
path = "src/main.rs"

[[bin]]
name = "audio-switch-stream-deck"
path = "src/bin/audio-switch-stream-deck.rs"
