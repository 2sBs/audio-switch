[package]
name = "audio-switch"
version.workspace = true
description = "Windows tray app for Audio Switch"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
anyhow.workspace = true
audio-switch-core = { path = "../audio-switch-core" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
windows.workspace = true

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "audio-switch"
path = "src/main.rs"
