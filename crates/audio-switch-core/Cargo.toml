[package]
name = "audio-switch-core"
version.workspace = true
description = "Configuration, state, IPC, and WASAPI routing for Audio Switch"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = { workspace = true, optional = true }

[features]
# Derives Swift bindings for the shared domain types (macOS app).
uniffi = ["dep:uniffi"]

[target.'cfg(windows)'.dependencies]
wasapi.workspace = true
windows.workspace = true

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSUUID", "NSValue"] }
