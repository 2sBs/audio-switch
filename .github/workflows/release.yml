name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Stream Deck CLI
        run: |
          npm install --global @elgato/cli@1.7.4
          streamdeck -v

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use the form vMAJOR.MINOR.PATCH; got '$env:RELEASE_TAG'."
          }

          $releaseVersion = $Matches.version
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }

          $application = $metadata.packages | Where-Object name -EQ 'audio-switch' | Select-Object -First 1
          if ($null -eq $application) { throw 'Could not find the audio-switch Cargo package.' }
          if ($application.version -ne $releaseVersion) {
              throw "Tag version $releaseVersion does not match Cargo version $($application.version)."
          }

          "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLUGIN_VERSION=$releaseVersion.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build release artifacts
        run: |
          .\scripts\package-stream-deck.ps1 -Version $env:PLUGIN_VERSION

          $executableName = "audio-switch-$env:RELEASE_VERSION-windows-x86_64.exe"
          Copy-Item -LiteralPath .\target\release\audio-switch.exe -Destination ".\dist\$executableName"

          $pluginName = "audio-switch-$env:RELEASE_VERSION.streamDeckPlugin"
          Move-Item -LiteralPath .\dist\com.2sbsi.audio-switch.streamDeckPlugin -Destination ".\dist\$pluginName"

          Get-ChildItem -LiteralPath .\dist -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              } |
              Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath .\dist -File | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
              gh release create $env:RELEASE_TAG @assets `
                  --verify-tag `
                  --generate-notes `
                  --title "Audio Switch $env:RELEASE_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
