name: Build and release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone app and Stream Deck plugin
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      release-version: ${{ steps.versions.outputs.release-version }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Stream Deck CLI
        run: |
          npm install --global @elgato/cli@1.7.4
          streamdeck -v

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Verify artifact versions
        id: versions
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_NAME: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }

          $application = $metadata.packages | Where-Object name -EQ 'audio-switch' | Select-Object -First 1
          if ($null -eq $application) { throw 'Could not find the audio-switch Cargo package.' }
          $releaseVersion = $application.version
          $pluginVersion = "$releaseVersion.0"

          $manifest = Get-Content -LiteralPath .\stream-deck\com.2sbsi.audio-switch.sdPlugin\manifest.json -Raw | ConvertFrom-Json
          if ($manifest.Version -ne $pluginVersion) {
              throw "Stream Deck version $($manifest.Version) does not match Cargo version $pluginVersion."
          }
          if ($manifest.CodePath -ne 'audio-switch-stream-deck.exe') {
              throw "The plugin must use the controller-only executable; found '$($manifest.CodePath)'."
          }

          if ($env:SOURCE_REF -like 'refs/tags/*') {
              if ($env:SOURCE_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
                  throw "Release tags must use the form vMAJOR.MINOR.PATCH; got '$env:SOURCE_NAME'."
              }
              if ($Matches.version -ne $releaseVersion) {
                  throw "Tag version $($Matches.version) does not match Cargo version $releaseVersion."
              }
          }

          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLUGIN_VERSION=$pluginVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release-version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Test workspace
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build release artifacts
        run: |
          cargo build --locked --release --bin audio-switch
          .\scripts\package-stream-deck.ps1 -Version $env:PLUGIN_VERSION
          .\scripts\package-installer.ps1 -Version $env:RELEASE_VERSION -SkipBuild

          $executableName = "audio-switch-$env:RELEASE_VERSION-windows-x86_64.exe"
          Copy-Item -LiteralPath .\target\release\audio-switch.exe -Destination ".\dist\$executableName"

          $pluginName = "audio-switch-$env:RELEASE_VERSION.streamDeckPlugin"
          Move-Item -LiteralPath .\dist\com.2sbsi.audio-switch.streamDeckPlugin -Destination ".\dist\$pluginName" -Force

          Get-ChildItem -LiteralPath .\dist -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              } |
              Set-Content -LiteralPath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio-switch-${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audio-switch-${{ needs.build.outputs.release-version }}
          path: dist

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
        run: |
          $files = @(Get-ChildItem -LiteralPath .\dist -File)
          $assets = $files | ForEach-Object FullName
          $expected = @{}
          foreach ($file in $files) {
              $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $expected[$file.Name] = "sha256:$digest"
          }

          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
              $release = $releaseJson | ConvertFrom-Json
              foreach ($asset in $release.assets) {
                  if (-not $expected.ContainsKey($asset.name) -or $expected[$asset.name] -ne $asset.digest) {
                      throw "Release $env:RELEASE_TAG already exists with different assets. Published releases are immutable."
                  }
              }
              if (-not $release.isDraft) {
                  if ($release.assets.Count -ne $expected.Count) {
                      throw "Release $env:RELEASE_TAG already exists with a different asset count. Published releases are immutable."
                  }
                  Write-Host "Release $env:RELEASE_TAG already contains the expected immutable assets."
                  exit 0
              }
          } else {
              gh release create $env:RELEASE_TAG @assets `
                  --verify-tag `
                  --generate-notes `
                  --title "Audio Switch $env:RELEASE_VERSION" `
                  --draft
              if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
              $release = gh release view $env:RELEASE_TAG --json isDraft,assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Could not verify the draft GitHub release.' }
          }

          foreach ($file in $files) {
              if ($release.assets.name -notcontains $file.Name) {
                  gh release upload $env:RELEASE_TAG $file.FullName
                  if ($LASTEXITCODE -ne 0) { throw "Could not upload $($file.Name) to the draft release." }
              }
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.assets.Count -ne $expected.Count) {
              throw 'The draft GitHub release does not contain the expected assets.'
          }
          foreach ($asset in $release.assets) {
              if (-not $expected.ContainsKey($asset.name) -or $expected[$asset.name] -ne $asset.digest) {
                  throw 'The draft GitHub release asset digests did not match the build.'
              }
          }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified GitHub release.' }
